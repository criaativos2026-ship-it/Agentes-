name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nexus_owner
          POSTGRES_PASSWORD: nexus_owner_dev
          POSTGRES_DB: nexus_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nexus_owner" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_MIGRATION_URL: postgres://nexus_owner:nexus_owner_dev@localhost:5432/nexus_test
      TEST_DATABASE_URL: postgres://nexus_app_user:ci_app_password_1234@localhost:5432/nexus_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Preparar banco (extensões, migrações e usuário da aplicação)
        run: |
          PGPASSWORD=nexus_owner_dev psql -h localhost -U nexus_owner -d nexus_test -c "CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS pgcrypto;"
          DATABASE_MIGRATION_URL=$TEST_DATABASE_MIGRATION_URL npx tsx scripts/migrate.ts
          DATABASE_MIGRATION_URL=$TEST_DATABASE_MIGRATION_URL APP_DB_PASSWORD=ci_app_password_1234 npx tsx scripts/create-app-db-user.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
